name: Build container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Test schedule handling
        run: node --experimental-strip-types --test tests/schedule.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kerber0ss/esvitlo-web:latest
            ghcr.io/kerber0ss/esvitlo-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published container
        env:
          IMAGE: ghcr.io/kerber0ss/esvitlo-web:${{ github.sha }}
        run: |
          docker run -d --name esvitlo-test -p 127.0.0.1:18080:3000 "$IMAGE"
          trap 'docker logs esvitlo-test; docker rm -f esvitlo-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:18080/api/schedule?queue=bad')" = 400
          curl --fail-with-body --silent --show-error --max-time 25 'http://127.0.0.1:18080/api/schedule?queue=1.1' > /tmp/schedule.json
          node -e "const d=require('/tmp/schedule.json'); if(d.queue!=='1.1'||!d.days?.length||!d.days[0].slots.length) process.exit(1); console.log('Live API verified:', d.queue, d.days[0].slots.length, 'slots');"
